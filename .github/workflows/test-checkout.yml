name: Test checkout API

on:
  pull_request:
    paths: ['api/**', 'tests/api/**', 'services.html', 'services-thanks.html', 'bookkeeping.html', 'shop.html', 'shop-thanks.html', 'manage-plan.html', 'vercel.json', '.github/workflows/test-checkout.yml']
  push:
    branches: [main]
    paths: ['api/**', 'tests/api/**', 'services.html', 'services-thanks.html', 'bookkeeping.html', 'shop.html', 'shop-thanks.html', 'manage-plan.html', 'vercel.json', '.github/workflows/test-checkout.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/api/*.test.js"
